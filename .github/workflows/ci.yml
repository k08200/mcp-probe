name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js doctor --config-file examples/self-check.config.json --output json

  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build
      - name: Self-check batch mode
        run: node dist/cli.js --config examples/self-check.config.json --github-summary --badge-file mcp-probe-badge.json
        timeout-minutes: 2
      - name: Self-check contract assertion failure
        run: node scripts/verify-contract-failure.mjs
        timeout-minutes: 2
      - name: Packed package smoke test
        run: |
          PACK_DIR="$(mktemp -d)"
          INSTALL_DIR="$(mktemp -d)"
          npm pack --pack-destination "$PACK_DIR"
          npm install "$PACK_DIR"/k08200-mcp-probe-*.tgz --prefix "$INSTALL_DIR" --no-audit --no-fund
          "$INSTALL_DIR"/node_modules/.bin/mcp-probe --version
          "$INSTALL_DIR"/node_modules/.bin/mcp-probe \
            --config "$INSTALL_DIR"/node_modules/@k08200/mcp-probe/examples/self-check.config.json \
            --output json
        timeout-minutes: 3
