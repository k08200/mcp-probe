name: Bug report
description: Report incorrect probe behavior or a failing MCP server check.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact mcp-probe command you ran. Redact secrets.
      placeholder: npx @k08200/mcp-probe@latest @scope/server --probe-tools
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste terminal or JSON output. Redact tokens, API keys, and private URLs.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mcp-probe version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.11.1"
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - streamable-http
        - sse
        - unknown
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
